<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    a { color: #4DABF7; }
    a:hover { color: #2A6FDB; }
  </style>
  <script>
    (function () {
      var start = Date.now();
      var id = setInterval(function () {
        var svg = document.querySelector('svg[data-om-exportable-video-with-duration-secs]');
        window.dispatchEvent(new Event('resize'));
        if (svg) {
          var m = getComputedStyle(svg).transform.match(/matrix\(([-\d.]+)/);
          var scale = m ? parseFloat(m[1]) : 0;
          if (scale > 0.06) { clearInterval(id); return; }
        }
        if (Date.now() - start > 6000) clearInterval(id);
      }, 150);
    })();
  </script>
</helmet>
<div style="position:fixed; top:0; left:0; width:100vw; height:100vh;">
  <x-import component-from-global-scope="ConnectScene" from="./animations.jsx ./scene-connect.jsx" hint-size="100%,100%"></x-import>
</div>
</x-dc>
</body>
</html>
